name: Bug report
description: Report a reproducible SPOOL defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Never attach private/customer datasets or credentials. Reduce data to a privacy-safe fixture whenever possible.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the migration stage where it occurred.
      placeholder: "During DRY RUN / EXECUTE / VERIFY..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      options:
        - Source selection / parsing
        - PROFILE
        - INFER
        - PLAN
        - DRY RUN / ASSESS
        - EXECUTE
        - VERIFY
        - Recovery / resume
        - Export
        - WebMCP
        - UI / routing
        - Not sure
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal privacy-safe reproducer
      description: Paste the smallest synthetic CSV/input and exact steps that reproduce the issue. Do not include private data.
      render: text
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 152 / Firefox ..."
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Console/errors
      description: Paste relevant console output or error codes. Remove secrets/private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: The reproducer contains no private/customer data or credentials.
          required: true
        - label: I can reproduce this on the current main branch or the public deployment.
