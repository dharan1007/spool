name: sync-v1.1-lock
on:
  push:
    branches: [ops/v1.1-lock-sync]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify release version consistency
        run: |
          test "$(node -p "require('./package.json').version")" = "1.1.0"
          test "$(node -p "require('./package-lock.json').version")" = "1.1.0"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.1.0"
      - name: Commit synchronized lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync v1.1.0 package lock"
          git push origin HEAD:release/v1.1.0
