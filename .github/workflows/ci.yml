name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducibly
        run: npm ci --ignore-scripts
      - name: Run production release gate
        id: gate
        shell: bash
        run: |
          set +e
          npm run check > ci-output.txt 2>&1
          status=$?
          cat ci-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload release-gate diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: increment-a-release-gate-output
          path: ci-output.txt
          if-no-files-found: error
          retention-days: 1
