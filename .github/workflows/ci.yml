name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducibly
        run: npm ci --ignore-scripts
      - name: Run production release gate and capture status
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check > ci-output.txt 2>&1
          status=$?
          cat ci-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Persist diagnostic output to temporary branch
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f ci-output.txt
          git commit -m "debug: capture Increment A gate output [skip ci]" || true
          git push origin HEAD:${{ github.head_ref }}
      - name: Fail when release gate failed
        if: steps.gate.outputs.status != '0'
        run: exit 1
