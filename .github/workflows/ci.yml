name: release-gate

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create or verify an immutable GitHub release from protected main
        required: false
        type: boolean
        default: false
      version:
        description: Semantic version without v prefix
        required: false
        type: string
        default: '1.0.0'
      commit_sha:
        description: Exact protected-main commit SHA; required when release is true
        required: false
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from committed lockfile
        run: npm ci
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Verify stable SQLite driver loads
        run: node -e "const D=require('better-sqlite3'); const db=new D(':memory:'); db.exec('CREATE TABLE probe(id INTEGER PRIMARY KEY) STRICT'); db.close(); console.log('better-sqlite3 runtime OK')"
      - name: Verify PostgreSQL driver loads
        run: node -e "import('pg').then(({Client}) => { if (typeof Client !== 'function') process.exit(1); console.log('pg runtime OK'); })"
      - name: Run production release gate
        env:
          SPOOL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check
      - name: Verify packed and globally installed CLI
        env:
          SPOOL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run pack:verify
      - name: Install browser smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client
      - name: Run built-browser smoke through production-style SPA rewrites
        env:
          SPOOL_SERVE_DIR: dist
          SPOOL_BROWSER: google-chrome
        run: |
          python3 scripts/spa-server.py --port 8876 --directory dist &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          SPOOL_URL=http://127.0.0.1:8876 python3 scripts/browser-smoke.py

  sqlite-portability:
    name: sqlite-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from committed lockfile
        run: npm ci
      - name: Verify native SQLite driver
        run: node -e "const D=require('better-sqlite3'); const db=new D(':memory:'); db.exec('CREATE TABLE probe(id INTEGER PRIMARY KEY) STRICT'); console.log(db.prepare('select sqlite_version() as v').get()); db.close();"
      - name: Run SQLite production conformance
        run: npm run test:conformance
      - name: Verify packed and globally installed CLI
        env:
          SPOOL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run pack:verify

  postgres-conformance:
    name: postgres-production-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: debezium/postgres:17
        env:
          POSTGRES_DB: spooltest
          POSTGRES_USER: spooltest
          POSTGRES_PASSWORD: spooltest-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spooltest -d spooltest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from committed lockfile
        run: npm ci
      - name: Run real PostgreSQL conformance and crash-fault suite
        env:
          SPOOL_TEST_POSTGRES_ENDPOINT: postgresql://127.0.0.1:5432/?sslmode=disable
          SPOOL_TEST_POSTGRES_DATABASE: spooltest
          SPOOL_TEST_POSTGRES_USER: spooltest
          SPOOL_TEST_PG_PASSWORD: spooltest-password
          SPOOL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --test --test-concurrency=1 tests/conformance/postgres-conformance.test.js tests/conformance/postgres-source-conformance.test.js tests/conformance/postgres-command-source-conformance.test.js tests/conformance/postgres-command-recovery-conformance.test.js tests/conformance/postgres-metadata-concurrency.test.js tests/conformance/postgres-content-verification.test.js tests/conformance/postgres-repair-conformance.test.js tests/conformance/postgres-database-source-conformance.test.js tests/conformance/postgres-bulk-conformance.test.js tests/conformance/postgres-cdc-conformance.test.js tests/conformance/postgres-workers-conformance.test.js
      - name: Qualify durable PostgreSQL materialization beyond the former 256 MiB ceiling
        env:
          SPOOL_TEST_POSTGRES_ENDPOINT: postgresql://127.0.0.1:5432/?sslmode=disable
          SPOOL_TEST_POSTGRES_DATABASE: spooltest
          SPOOL_TEST_POSTGRES_USER: spooltest
          SPOOL_TEST_PG_PASSWORD: spooltest-password
          SPOOL_QUALIFICATION_ROWS: '300000'
          SPOOL_QUALIFICATION_PAYLOAD_BYTES: '1024'
          SPOOL_QUALIFICATION_MAX_RSS_BYTES: '536870912'
        run: node scripts/qualify-postgres-materialization.js

  mysql-conformance:
    name: mysql-production-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-root-password
          MYSQL_DATABASE: spooltest
          MYSQL_USER: spooltest
          MYSQL_PASSWORD: spooltest-password
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from committed lockfile
        run: npm ci
      - name: Run real MySQL source and target conformance
        env:
          SPOOL_TEST_MYSQL_ENDPOINT: mysql://127.0.0.1:3306/
          SPOOL_TEST_MYSQL_DATABASE: spooltest
          SPOOL_TEST_MYSQL_USER: spooltest
          SPOOL_TEST_MYSQL_PASSWORD: spooltest-password
          SPOOL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --test --test-concurrency=1 tests/conformance/mysql-source-conformance.test.js tests/conformance/mysql-target-conformance.test.js

  release:
    name: publish-release
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: [verify, sqlite-portability, postgres-conformance, mysql-conformance]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from committed lockfile
        run: npm ci
      - name: Publish or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
        run: bash scripts/publish-release.sh
