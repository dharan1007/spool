name: production-public-smoke

on:
  push:
    branches:
      - ops/production-smoke-9fb9966

permissions:
  contents: read

env:
  SPOOL_EXPECTED_SHA: 9fb9966088e7a7c185ce1ff97b0cb0a7d78e7b8a
  SPOOL_URL: https://spool-webmcp.vercel.app
  SPOOL_BROWSER: google-chrome

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9fb9966088e7a7c185ce1ff97b0cb0a7d78e7b8a
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci
      - name: Install browser smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client
      - name: Verify canonical production release identity
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ['SPOOL_URL'].rstrip('/') + '/release.json'
          with urllib.request.urlopen(url, timeout=20) as response:
              release = json.load(response)
          expected = os.environ['SPOOL_EXPECTED_SHA']
          actual = release.get('commit')
          print({'expected': expected, 'actual': actual, 'release': release})
          if actual != expected:
              raise SystemExit(f'production release mismatch: expected {expected}, got {actual}')
          PY
      - name: Harden Chrome startup for external navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/browser-smoke.py')
          s = p.read_text()
          old = """        f'--user-data-dir={profile}', target
"""
          new = """        '--remote-debugging-address=127.0.0.1', '--no-first-run', '--no-default-browser-check',
        f'--user-data-dir={profile}', 'about:blank'
"""
          if old not in s:
              raise SystemExit('browser launch anchor not found')
          s = s.replace(old, new, 1)
          old = """        cdp.call('Log.enable')

        wait_for(lambda: cdp.eval('document.readyState === \"complete\"'), timeout=20, label='page load')
"""
          new = """        cdp.call('Log.enable')
        cdp.call('Page.navigate', {'url': target})

        wait_for(lambda: cdp.eval('document.readyState === \"complete\"'), timeout=30, label='page load')
"""
          if old not in s:
              raise SystemExit('navigation anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace("timeout=10, label='Chromium CDP'", "timeout=30, label='Chromium CDP'", 1)
          p.write_text(s)
          PY
      - name: Run real Chrome against public production
        env:
          DBUS_SESSION_BUS_ADDRESS: ''
        run: python3 scripts/browser-smoke.py "$SPOOL_URL"
