name: production-public-smoke

on:
  push:
    branches:
      - ops/production-smoke-9fb9966

permissions:
  contents: read

env:
  SPOOL_EXPECTED_SHA: 9fb9966088e7a7c185ce1ff97b0cb0a7d78e7b8a
  SPOOL_URL: https://spool-webmcp.vercel.app
  SPOOL_BROWSER: google-chrome

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client
      - name: Run robust Chrome smoke against public production
        run: python3 scripts/remote-production-smoke.py
