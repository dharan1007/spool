name: sync-sqlite-lock

on:
  push:
    branches: [production-rollout-20260909]
    paths:
      - package.json
      - .github/workflows/sync-sqlite-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-rollout-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact dependency graph without executing install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize sqlite dependency lock"
          git push origin HEAD:production-rollout-20260909
