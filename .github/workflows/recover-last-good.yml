name: Recover last known-good SPOOL production bundle

on:
  push:
    branches: [spool-prod-recovery]
    paths:
      - '.github/workflows/recover-last-good.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch authenticated rollback candidate
        shell: bash
        env:
          BASE: https://spool-webmcp-cc14eered-tejs-projects-70bb4568.vercel.app
          SHARE: YtxGS3RtZxyyt1BnpRADeCca5jXek6Nv
        run: |
          set -euo pipefail
          rm -rf /tmp/spool-good && mkdir -p /tmp/spool-good
          jar=/tmp/spool-good/cookies.txt
          curl --fail --silent --show-error --location --cookie-jar "$jar" --cookie "$jar" "$BASE/?_vercel_share=$SHARE" -o /tmp/spool-good/index.html
          grep -q '<html' /tmp/spool-good/index.html
          echo 'Fetched candidate HTML:'
          wc -c /tmp/spool-good/index.html
          if grep -q '/payload-[0-9]' /tmp/spool-good/index.html; then
            echo payload > /tmp/spool-good/mode
            mapfile -t payloads < <(grep -oE '/payload-[0-9]+\.js' /tmp/spool-good/index.html | sort -u)
            test "${#payloads[@]}" -gt 0
            printf '%s\n' "${payloads[@]}" > /tmp/spool-good/payload-list.txt
            for p in "${payloads[@]}"; do
              curl --fail --silent --show-error --location --cookie "$jar" "$BASE$p" -o "/tmp/spool-good/$(basename "$p")"
            done
            curl --fail --silent --show-error --location --cookie "$jar" "$BASE/bootstrap.js" -o /tmp/spool-good/bootstrap.js
          else
            echo modules > /tmp/spool-good/mode
          fi
      - name: Reconstruct candidate and prove bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          mode=$(cat /tmp/spool-good/mode)
          test "$mode" = payload || { echo "candidate mode is $mode, not payload"; exit 2; }
          cat > /tmp/spool-good/reconstruct.mjs <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import zlib from 'node:zlib';
          import crypto from 'node:crypto';
          const dir='/tmp/spool-good';
          const files=fs.readFileSync(`${dir}/payload-list.txt`,'utf8').trim().split(/\n+/).filter(Boolean);
          const context=vm.createContext({globalThis:{}});
          for(const p of files) vm.runInContext(fs.readFileSync(`${dir}/${p.slice(1)}`,'utf8'),context,{filename:p});
          const encoded=context.globalThis.__SPOOL_PAYLOAD__;
          if(typeof encoded!=='string'||encoded.length<1000) throw new Error('payload assembly failed');
          const compressed=Buffer.from(encoded,'base64');
          const decoded=zlib.gunzipSync(compressed).toString('utf8');
          const bundle=JSON.parse(decoded);
          for(const k of ['body','css','js']) if(typeof bundle[k]!=='string'||bundle[k].length===0) throw new Error(`missing ${k}`);
          fs.writeFileSync(`${dir}/body.html`,bundle.body);
          fs.writeFileSync(`${dir}/styles.css`,bundle.css);
          fs.writeFileSync(`${dir}/app.js`,bundle.js);
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          console.log(JSON.stringify({payloadFiles:files.length,compressedBytes:compressed.length,bodyBytes:Buffer.byteLength(bundle.body),cssBytes:Buffer.byteLength(bundle.css),jsBytes:Buffer.byteLength(bundle.js),jsSha256:sha(bundle.js)},null,2));
          NODE
          node /tmp/spool-good/reconstruct.mjs
          node --check /tmp/spool-good/app.js
      - name: Build direct same-origin recovery release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovery-release && mkdir recovery-release
          cp /tmp/spool-good/styles.css recovery-release/styles.css
          cp /tmp/spool-good/app.js recovery-release/app.js
          cp vercel.json recovery-release/vercel.json
          cat > recovery-release/boot-watchdog.js <<'JS'
          (()=>{let done=false;const t=setTimeout(()=>{if(done)return;document.body.innerHTML='<main style="font-family:system-ui;background:#080a0a;color:#fff;min-height:100vh;padding:32px"><h1>SPOOL could not start</h1><p>The application failed during startup. Reload the page. Your local data has not been uploaded or modified.</p><button onclick="location.reload()">Reload SPOOL</button></main>';},12000);globalThis.__spoolBooted=()=>{done=true;clearTimeout(t);};})();
          JS
          python3 - <<'PY'
          from pathlib import Path
          body=Path('/tmp/spool-good/body.html').read_text()
          html='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#080a0a"><meta name="description" content="SPOOL is a local-first Autopilot data migration studio with stateful WebMCP orchestration, deterministic transforms and durable recovery."><title>SPOOL — Autopilot data migration</title><link rel="stylesheet" href="/styles.css"></head><body>'''+body+'''<script src="/boot-watchdog.js"></script><script src="/app.js"></script><script>globalThis.__spoolBooted?.()</script></body></html>'''
          Path('recovery-release/index.html').write_text(html)
          PY
          python3 - <<'PY'
          import json
          p='recovery-release/vercel.json'
          cfg=json.load(open(p))
          for rule in cfg.get('headers',[]):
              for h in rule.get('headers',[]):
                  if h.get('key')=='Content-Security-Policy':
                      h['value']="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
          json.dump(cfg,open(p,'w'),indent=2)
          PY
          grep -q "connect-src 'none'" recovery-release/vercel.json
          ! grep -R -E "https?://|fetch\(|XMLHttpRequest|WebSocket" recovery-release/app.js
      - name: Commit verified recovery release to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery-release
          git commit -m 'Add verified direct-boot SPOOL recovery release'
          git push
