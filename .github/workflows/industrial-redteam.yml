name: industrial-redteam

on:
  push:
    branches:
      - audit/industrial-redteam-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependency graph
        run: npm ci
      - name: Run independent industrial red-team tests
        run: node --test --test-concurrency=1 tests/industrial-redteam.test.js
