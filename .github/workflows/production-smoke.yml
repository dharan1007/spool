name: production-smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Production base URL
        required: false
        default: https://spool-webmcp.vercel.app
      expected_sha:
        description: Exact deployed Git SHA; defaults to the workflow commit
        required: false
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed release and artifact identity
        env:
          SPOOL_URL: ${{ inputs.url || 'https://spool-webmcp.vercel.app' }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: node scripts/verify-deployed-release.js "$SPOOL_URL" "$EXPECTED_SHA"
      - name: Install browser smoke dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client
      - name: Run production browser smoke
        env:
          SPOOL_URL: ${{ inputs.url || 'https://spool-webmcp.vercel.app' }}
          SPOOL_BROWSER: google-chrome
        run: python3 scripts/browser-smoke.py
