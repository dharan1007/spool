name: SPOOL production boot diagnosis

on:
  push:
    branches: [spool-prod-recovery]
    paths: ['.github/workflows/prod-diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch production payload
        shell: bash
        run: |
          set -euo pipefail
          base='https://spool-webmcp.vercel.app'
          rm -rf /tmp/spool-prod && mkdir -p /tmp/spool-prod
          curl -fsSL "$base/" -o /tmp/spool-prod/index.html
          curl -fsSL "$base/bootstrap.js" -o /tmp/spool-prod/bootstrap.js
          mapfile -t payloads < <(grep -oE '/payload-[0-9]+\.js' /tmp/spool-prod/index.html | sort -V -u)
          printf '%s\n' "${payloads[@]}" > /tmp/spool-prod/payload-list.txt
          for p in "${payloads[@]}"; do curl -fsSL "$base$p" -o "/tmp/spool-prod/$(basename "$p")"; done
          test "${#payloads[@]}" -eq 5
      - name: Prove exact corruption and test every chunk ordering
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spool-prod/diagnose.mjs <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import zlib from 'node:zlib';
          import crypto from 'node:crypto';
          const root='/tmp/spool-prod';
          const files=fs.readFileSync(`${root}/payload-list.txt`,'utf8').trim().split(/\n+/).map(x=>x.slice(1));
          const chunks=files.map(f=>{const c=vm.createContext({globalThis:{}});vm.runInContext(fs.readFileSync(`${root}/${f}`,'utf8'),c);return c.globalThis.__SPOOL_PAYLOAD__;});
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          console.log(JSON.stringify(files.map((f,i)=>({file:f,chars:chunks[i].length,sha256:sha(chunks[i])})),null,2));
          const nominal=chunks.join('');
          const bytes=Buffer.from(nominal,'base64');
          console.log(`nominal encoded=${nominal.length} mod4=${nominal.length%4} compressed=${bytes.length} magic=${bytes.subarray(0,2).toString('hex')}`);
          try{zlib.gunzipSync(bytes);console.log('NOMINAL_VALID');process.exit(0)}catch(e){console.log(`NOMINAL_ERROR=${e.code}:${e.message}`)}
          function *permute(a,n=a.length){if(n<=1){yield a.slice();return}for(let i=0;i<n;i++){yield*permute(a,n-1);const j=n%2?0:i;[a[n-1],a[j]]=[a[j],a[n-1]]}}
          let valid=0;
          for(const order of permute([0,1,2,3,4])){
            const s=order.map(i=>chunks[i]).join('');
            try{const out=zlib.gunzipSync(Buffer.from(s,'base64'));JSON.parse(out.toString('utf8'));console.log(`VALID_ORDER=${order.join(',')}`);valid++;}catch{}
          }
          console.log(`VALID_PERMUTATIONS=${valid}`);
          if(valid===0) process.exitCode=2;
          NODE
          node /tmp/spool-prod/diagnose.mjs
      - name: Verify failure containment architecture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DecompressionStream('gzip')" /tmp/spool-prod/bootstrap.js
          grep -q "await import(jsUrl)" /tmp/spool-prod/bootstrap.js
          ! grep -q 'boot-watchdog.js' /tmp/spool-prod/index.html
          echo 'No independent startup watchdog exists in canonical production.'
