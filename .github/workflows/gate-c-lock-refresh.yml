name: gate-c-lock-refresh

on:
  push:
    branches: [gate-c-postgres-runtime]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-c-postgres-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh exact PostgreSQL dependency lock
        run: npm install --save-exact --package-lock-only --ignore-scripts pg@8.23.0
      - name: Commit deterministic lock update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lock already current"
            exit 0
          fi
          git commit -m "build: lock PostgreSQL production driver"
          git push origin HEAD:gate-c-postgres-runtime
