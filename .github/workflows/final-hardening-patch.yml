# Trigger after TDD red: release-gate run 304 proved the full-source 95% acceptance contract fails before implementation.
name: final-hardening-patch

on:
  push:
    branches:
      - fix/production-hardening-nyc311-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix final real-data hardening' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-nyc311-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final kernel and UX patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('src/core/command-kernel.js')
          s = p.read_text()
          s = replace_once(s,
              "function clone(value) { return structuredClone(value); }\n",
              """function clone(value) { return structuredClone(value); }\n\nconst AUTOPILOT_DRY_RUN_SIZE = 100;\nconst AUTOPILOT_MIN_ACCEPTANCE = 0.95;\n\nfunction representativeRows(rows, limit = AUTOPILOT_DRY_RUN_SIZE) {\n  if (!Array.isArray(rows) || rows.length === 0) return [];\n  if (rows.length <= limit) return rows;\n  if (limit <= 1) return [rows[0]];\n  const sampled = [];\n  for (let i = 0; i < limit; i += 1) {\n    const index = Math.floor((i * (rows.length - 1)) / (limit - 1));\n    sampled.push(rows[index]);\n  }\n  return sampled;\n}\n""",
              'dry-run constants')

          old = """    const previewRevision = this.workspace.mappingRevision + 1;\n    const preview = this.engine.run(\n      this.workspace.source.rows.slice(0, Math.min(100, this.workspace.source.rows.length)),\n      plan.mapping,\n      previewRevision,\n      plan.targetSchema\n    );\n    this.workspace.mission.dryRun = {\n      processedRows: preview.processedRows,\n      validRows: preview.validRows,\n      invalidRows: preview.invalidRows,\n      violationGroups: preview.violations.map(group => ({ code: group.code, count: group.count }))\n    };\n    if (preview.processedRows > 0 && preview.validRows === 0) {\n      const decision = {\n        code: 'DRY_RUN_ZERO_ACCEPTANCE',\n        message: 'Autopilot dry run accepted zero rows. Execution was not started; revise the outcome or target interpretation.',\n        sourceFields: []\n      };\n      this.workspace.mission.status = 'NEEDS_ATTENTION';\n      this.workspace.mission.ambiguities = [...(this.workspace.mission.ambiguities ?? []), decision];\n      this.workspace.mission.interventions += 1;\n      this.workspace.mission.updatedAt = new Date().toISOString();\n      await this.persist();\n      return this.envelope({\n        status: 'NEEDS_ATTENTION',\n        reason: decision.code,\n        ambiguityCount: this.workspace.mission.ambiguities.length,\n        ambiguities: clone(this.workspace.mission.ambiguities),\n        dryRun: clone(this.workspace.mission.dryRun),\n        confidence: plan.confidence\n      });\n    }\n"""
          new = """    const previewRevision = this.workspace.mappingRevision + 1;\n    const previewRows = representativeRows(this.workspace.source.rows);\n    const preview = this.engine.run(\n      previewRows,\n      plan.mapping,\n      previewRevision,\n      plan.targetSchema\n    );\n    const acceptanceRate = preview.processedRows > 0 ? preview.validRows / preview.processedRows : 1;\n    const assessment = preview.validRows === 0 || acceptanceRate < AUTOPILOT_MIN_ACCEPTANCE\n      ? 'BLOCK'\n      : preview.invalidRows > 0\n        ? 'WARNING'\n        : 'PASS';\n    this.workspace.mission.dryRun = {\n      processedRows: preview.processedRows,\n      validRows: preview.validRows,\n      invalidRows: preview.invalidRows,\n      acceptanceRate: Number(acceptanceRate.toFixed(4)),\n      minimumAcceptance: AUTOPILOT_MIN_ACCEPTANCE,\n      assessment,\n      sampling: previewRows.length === this.workspace.source.rows.length ? 'full_source' : 'evenly_spaced_full_source',\n      violationGroups: preview.violations.map(group => ({ code: group.code, count: group.count }))\n    };\n    if (assessment === 'BLOCK') {\n      const zeroAcceptance = preview.validRows === 0;\n      const decision = {\n        code: zeroAcceptance ? 'DRY_RUN_ZERO_ACCEPTANCE' : 'DRY_RUN_ACCEPTANCE_BELOW_THRESHOLD',\n        message: zeroAcceptance\n          ? 'Autopilot dry run accepted zero rows. Execution was not started; revise the outcome or target interpretation.'\n          : `Autopilot dry run accepted ${preview.validRows}/${preview.processedRows} representative rows, below the ${(AUTOPILOT_MIN_ACCEPTANCE * 100).toFixed(0)}% safety floor. Execution was not started.`,\n        sourceFields: []\n      };\n      this.workspace.mission.status = 'NEEDS_ATTENTION';\n      this.workspace.mission.ambiguities = [...(this.workspace.mission.ambiguities ?? []), decision];\n      this.workspace.mission.interventions += 1;\n      this.workspace.mission.updatedAt = new Date().toISOString();\n      await this.persist();\n      return this.envelope({\n        status: 'NEEDS_ATTENTION',\n        reason: decision.code,\n        ambiguityCount: this.workspace.mission.ambiguities.length,\n        ambiguities: clone(this.workspace.mission.ambiguities),\n        dryRun: clone(this.workspace.mission.dryRun),\n        confidence: plan.confidence\n      });\n    }\n"""
          s = replace_once(s, old, new, 'representative dry-run policy')
          p.write_text(s)

          p = Path('src/product-surface.js')
          s = p.read_text()
          s = replace_once(s, '--expires 2026-12-31T23:59:59Z', '--expires 2026-12-31T23:59:59.000Z', 'website canonical expiry')
          p.write_text(s)

          p = Path('src/app.js')
          s = p.read_text()
          s = replace_once(s,
              "['DRY RUN', 'Test the real engine', 'A bounded sample goes through the same transform and typed validation path as the full run.'],",
              "['DRY RUN', 'Test the real engine', 'A representative 100-row sample is spread across the full source and goes through the same transform and typed validation path as the full run. Below 95% acceptance stops execution.'],",
              'autopilot stage copy')
          marker = "    <section class=\"mission-grid\">\n"
          warning = """    ${mission?.dryRun?.assessment === 'WARNING' ? `<div class=\"attention-note\"><strong>Dry-run warning:</strong> ${number(mission.dryRun.validRows)} / ${number(mission.dryRun.processedRows)} representative rows passed (${Math.round((mission.dryRun.acceptanceRate ?? 0) * 100)}%). Execution continued because the result met the ${Math.round((mission.dryRun.minimumAcceptance ?? 0.95) * 100)}% safety floor; rejected rows remain explicit.</div>` : ''}\n\n"""
          s = replace_once(s, marker, warning + marker, 'visible dry-run warning')
          p.write_text(s)
          PY
      - name: Verify focused hardening contracts
        run: node --test tests/production-hardening-regressions.test.js tests/autopilot.test.js tests/webmcp.test.js
      - name: Commit final product patch
        run: |
          git config user.name "spool-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/command-kernel.js src/product-surface.js src/app.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix final real-data hardening"
          git push origin HEAD:fix/production-hardening-nyc311-20260910
