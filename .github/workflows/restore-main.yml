name: Restore verified SPOOL source to main

on:
  push:
    branches: [spool-prod-recovery]
    paths:
      - '.github/workflows/restore-main.yml'
      - '.source-recovery/recover3.part-*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and validate recovered archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .source-recovery -maxdepth 1 -name 'recover3.part-*.b64' | wc -l)" -eq 13
          cat .source-recovery/recover3.part-*.b64 > /tmp/recovered.b64
          test "$(wc -c < /tmp/recovered.b64)" -eq 60012
          base64 --decode /tmp/recovered.b64 > /tmp/recovered.tgz
          echo '547fe07b4071603e86d13b4b74bf503ab123953dac9c7ab4a45b4414e7868343  /tmp/recovered.tgz' | sha256sum --check --strict
          rm -rf /tmp/spool-recovered
          mkdir -p /tmp/spool-recovered
          tar -xzf /tmp/recovered.tgz -C /tmp/spool-recovered
          test -s /tmp/spool-recovered/src/app.js
          test -s /tmp/spool-recovered/src/core/command-kernel.js
          test -s /tmp/spool-recovered/src/worker/migration.worker.js
          test -s /tmp/spool-recovered/tests/release-contract.test.js
          test -s /tmp/spool-recovered/docs/superpowers/specs/2026-09-04-autopilot-product-rebuild-design.md
          echo 'Recovered source archive is byte-identical and structurally valid.'
      - name: Restore canonical main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -rf src tests docs/superpowers .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          mkdir -p docs
          cp -a /tmp/spool-recovered/src ./src
          cp -a /tmp/spool-recovered/tests ./tests
          cp -a /tmp/spool-recovered/docs/superpowers ./docs/superpowers
          test -s src/app.js
          test -s src/core/command-kernel.js
          test -s src/worker/migration.worker.js
          test -s tests/release-contract.test.js
          ! find . -type f -name 'payload-*.js' | grep -q .
          ! grep -R "DecompressionStream" index.html boot-watchdog.js src scripts vercel.json
          grep -q '<script src="/boot-watchdog.js"></script>' index.html
          grep -q '<script type="module" src="/src/app.js"></script>' index.html
      - name: Run complete release gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
      - name: Commit verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore verified same-origin SPOOL production source'
          git push origin HEAD:main
