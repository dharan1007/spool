name: Bootstrap exact SPOOL source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/spool-source.zip'
      - '.github/workflows/bootstrap-source.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover and expand verified source package
        shell: bash
        run: |
          set -euo pipefail
          archive='.bootstrap/spool-source.zip'
          if unzip -t "$archive" >/dev/null 2>&1; then
            unzip -o "$archive" -d .
          else
            echo 'Bootstrap archive has no usable central directory; attempting deterministic ZIP recovery.'
            rm -f /tmp/spool-source-recovered.zip
            zip -FF "$archive" --out /tmp/spool-source-recovered.zip
            unzip -t /tmp/spool-source-recovered.zip
            unzip -o /tmp/spool-source-recovered.zip -d .
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact package
        run: npm ci --ignore-scripts && npm run check
      - name: Commit complete source tree
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source restoration changes to commit.'
            exit 0
          fi
          git commit -m 'Restore complete verified SPOOL source tree'
          git push
