name: Bootstrap exact SPOOL source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/spool-source.zip'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source package
        run: unzip -o .bootstrap/spool-source.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact package
        run: npm ci --ignore-scripts && npm run check
      - name: Commit complete source tree
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore complete verified SPOOL source tree'
          git push
