name: bootstrap-complete-source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-source.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore deployed runtime source
        shell: bash
        run: |
          set -euo pipefail
          base='https://spool-webmcp.vercel.app'
          files=(
            src/app.js
            src/core/autopilot.js
            src/core/command-kernel.js
            src/core/csv.js
            src/core/demo.js
            src/core/errors.js
            src/core/migration.js
            src/core/schema.js
            src/core/state-machine.js
            src/core/transforms.js
            src/runtime/browser-worker-runtime.js
            src/runtime/worker-protocol.js
            src/storage/indexeddb.js
            src/storage/memory.js
            src/webmcp/optional.js
            src/webmcp/registry.js
            src/worker/migration.worker.js
            styles.css
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl --fail --silent --show-error --location "$base/$f" -o "$f"
          done
      - name: Restore verified test suite
        shell: bash
        run: |
          cat > /tmp/tests.tgz.b64 <<'B64'

B64
          base64 -d /tmp/tests.tgz.b64 > /tmp/tests.tgz
          tar -xzf /tmp/tests.tgz
      - name: Commit complete tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src styles.css tests vercel.json
          if ! git diff --cached --quiet; then
            git commit -m 'Restore complete verified SPOOL source tree'
            git push
          fi
