name: Check Vercel deployment credential availability

on:
  push:
    branches: [spool-prod-recovery]
    paths: ['.github/workflows/check-vercel-credentials.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      VERCEL_TOKEN_A: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_B: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_C: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
    steps:
      - name: Check presence only
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in VERCEL_TOKEN_A VERCEL_TOKEN_B VERCEL_TOKEN_C; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
              found=1
            else
              echo "$name=absent"
            fi
          done
          test "$found" -eq 1
