name: release-v1.1.1-prep

on:
  push:
    branches: [release/v1.1.1]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize release metadata and public version links
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lockPath = 'package-lock.json';
          let lock = fs.readFileSync(lockPath, 'utf8');
          lock = lock.replaceAll('https://www.patreon.com/sponsors/feross', 'https://www.patreon.com/feross');
          fs.writeFileSync(lockPath, lock);
          for (const path of ['README.md', 'src/product-surface.js']) {
            let text = fs.readFileSync(path, 'utf8');
            text = text.replaceAll('v1.1.0', 'v1.1.1');
            fs.writeFileSync(path, text);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lockJson = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          if (pkg.version !== '1.1.1' || lockJson.version !== '1.1.1' || lockJson.packages[''].version !== '1.1.1') process.exit(2);
          NODE
      - name: Remove one-time preparation workflow
        run: rm .github/workflows/release-v1.1.1-prep.yml
      - name: Commit prepared release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json README.md src/product-surface.js .github/workflows/release-v1.1.1-prep.yml
          git commit -m 'release: prepare v1.1.1 public surface'
          git push origin HEAD:release/v1.1.1
