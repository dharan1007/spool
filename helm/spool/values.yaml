replicaCount: 2

image:
  repository: spool/spool-enterprise
  pullPolicy: IfNotPresent
  tag: "2.0.0"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: spool.internal.corp
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s

env:
  NODE_ENV: production
  SPOOL_SOURCE_CEILING_BYTES: "10737418240" # 10 GB
