apiVersion: apps/v1
kind: Deployment
metadata:
  name: spool-enterprise
  labels:
    app.kubernetes.io/name: spool-enterprise
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spool-enterprise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spool-enterprise
    spec:
      containers:
        - name: spool
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v2/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v2/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: "{{ .Values.env.NODE_ENV }}"
            - name: SPOOL_SOURCE_CEILING_BYTES
              value: "{{ .Values.env.SPOOL_SOURCE_CEILING_BYTES }}"
