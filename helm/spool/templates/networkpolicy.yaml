{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spool.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the proxy port is reachable, and only from labelled namespaces.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - port: 8081
          protocol: TCP
  egress:
    # DNS resolution only. The daemon is loopback-only and makes no other
    # outbound connection; migration sources and targets are local volumes.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
