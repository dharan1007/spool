{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "spool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spool.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "spool.selectorLabels" . | nindent 6 }}
  endpoints:
    # /v2/metrics is unauthenticated on the daemon; the NetworkPolicy is what
    # keeps it off the pod network except through the proxy.
    - port: http
      path: /v2/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
